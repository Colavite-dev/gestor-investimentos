services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-gestor_investimento}
      POSTGRES_USER: ${DB_USERNAME:-gestor_investimento}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:

spring.datasource.url=jdbc:h2:mem:gestor_investimento;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.default-schema=PUBLIC
spring.flyway.schemas=PUBLIC

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=PUBLIC

spring.jackson.deserialization.fail-on-unknown-properties=true

integration.cnpj.brasil-api.base-url=http://localhost:1
integration.cnpj.brasil-api.connect-timeout=100ms
integration.cnpj.brasil-api.read-timeout=100ms

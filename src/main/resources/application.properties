spring.application.name=gestor-investimento

app.auth.jwt-secret=${JWT_SECRET:}
app.demo-admin.enabled=${APP_DEMO_ADMIN_ENABLED:false}
app.demo-admin.username=${APP_DEMO_ADMIN_USERNAME:}
app.demo-admin.password=${APP_DEMO_ADMIN_PASSWORD:}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:gestor_investimento}
spring.datasource.username=${DB_USERNAME:gestor_investimento}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.default-schema=public
spring.flyway.schemas=public

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

spring.jackson.deserialization.fail-on-unknown-properties=true

integration.cnpj.brasil-api.base-url=${BRASIL_API_BASE_URL:https://brasilapi.com.br}
integration.cnpj.brasil-api.connect-timeout=${BRASIL_API_CONNECT_TIMEOUT:2s}
integration.cnpj.brasil-api.read-timeout=${BRASIL_API_READ_TIMEOUT:5s}

integration.cep.via-cep.base-url=${VIA_CEP_BASE_URL:https://viacep.com.br}
integration.cep.via-cep.connect-timeout=${VIA_CEP_CONNECT_TIMEOUT:2s}
integration.cep.via-cep.read-timeout=${VIA_CEP_READ_TIMEOUT:5s}

integration.cvm.participants.dataset-url=${CVM_PARTICIPANTS_DATASET_URL:https://dados.cvm.gov.br/dados/INTERMED/CAD/DADOS/cad_intermed.zip}
integration.cvm.participants.connect-timeout=${CVM_PARTICIPANTS_CONNECT_TIMEOUT:2s}
integration.cvm.participants.read-timeout=${CVM_PARTICIPANTS_READ_TIMEOUT:10s}
integration.cvm.participants.refresh-interval=${CVM_PARTICIPANTS_REFRESH_INTERVAL:24h}

integration.stock.brapi.base-url=${BRAPI_BASE_URL:https://brapi.dev}
integration.stock.brapi.connect-timeout=${BRAPI_CONNECT_TIMEOUT:2s}
integration.stock.brapi.read-timeout=${BRAPI_READ_TIMEOUT:5s}
integration.stock.brapi.token=${BRAPI_TOKEN:}

integration.stock.twelve-data.base-url=${TWELVE_DATA_BASE_URL:https://api.twelvedata.com}
integration.stock.twelve-data.connect-timeout=${TWELVE_DATA_CONNECT_TIMEOUT:2s}
integration.stock.twelve-data.read-timeout=${TWELVE_DATA_READ_TIMEOUT:5s}
integration.stock.twelve-data.api-key=${TWELVE_DATA_API_KEY:}
